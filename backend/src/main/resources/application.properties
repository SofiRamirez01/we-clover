spring.application.name=backend
# Conexión a MySQL en Docker
spring.datasource.url=jdbc:mysql://localhost:3306/weclover_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Almacenamiento local de archivos subidos (moldería, ficha técnica, etc.)
app.uploads.dir=uploads
app.uploads.patrones-corte-dir=${app.uploads.dir}/patrones-corte
app.uploads.patrones-corte-url-base=/uploads/patrones-corte/
app.uploads.fichas-tecnicas-dir=${app.uploads.dir}/fichas-tecnicas
app.uploads.fichas-tecnicas-url-base=/uploads/fichas-tecnicas/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Servicio de geometría de piezas (FastAPI, ver services/pieza-geometria)
app.pieza-geometria.base-url=http://localhost:8001
